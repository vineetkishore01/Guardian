services:
  guardian:
    image: guardian:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guardian
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      # Docker Daemon socket (auto-discovery & stats)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Host telemetry
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # Lets Guardian report the real distro name instead of guessing
      - /etc/os-release:/host/etc/os-release:ro
      # Storage monitoring — mount whatever you want measured
      - /:/host/root:ro
      - /mnt/nas:/host/mnt/nas:ro
      # Persistent icons and URLs config
      - guardian_data:/data
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc
      - HOST_ROOT=/host/root
      - HOST_NAS=/host/mnt/nas
      # Optional: extra mount points to watch, comma separated
      # - HOST_MOUNTS=/host/mnt/backup
      # Seed the LAN / Tailscale launch targets; both editable in Settings
      - SERVER_IP=192.168.0.26
      - TAILSCALE_IP=100.94.238.9
      - PORT=3001
      - NODE_ENV=production
      # Shutdown / reboot from the dashboard. Off unless explicitly enabled;
      # in a container this acts on the container unless you supply a command
      # that reaches the host via GUARDIAN_POWER_COMMAND.
      # - ENABLE_POWER_CONTROLS=true
      # - GUARDIAN_POWER_COMMAND=/usr/bin/ssh admin@host sudo systemctl {action}
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.50'

volumes:
  guardian_data:
    name: guardian_data
